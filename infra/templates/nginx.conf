user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile             on;
    tcp_nopush            on;
    keepalive_timeout     65;
    types_hash_max_size   4096;
    client_max_body_size  20m;

    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Family Table: no domain yet, so TLS is a self-signed cert (generated on
    # the persistent data volume — see user_data). The app's session cookie
    # is Secure-flagged in production, so plain HTTP can't hold a login;
    # everything redirects to HTTPS. When a real domain exists later, swap
    # this cert for a Let's Encrypt one via certbot — no other change needed.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate     /opt/family-table/app/data/tls/selfsigned.crt;
        ssl_certificate_key /opt/family-table/app/data/tls/selfsigned.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }
    }
}
